name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── CI: install, lint, build ──────────────────────────────
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:@localhost:3306/rcc_hiros
      JWT_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + production build)
        run: npm run build

  # ── CD: build image and deploy on merge to main ──────────
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build and start production stack
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          ARGS=""
          if [ -n "$TUNNEL_TOKEN" ]; then
            ARGS="--profile tunnel"
          fi
          docker compose $ARGS up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$code" != "000" ]; then
              echo "App is responding (HTTP $code)"
              exit 0
            fi
            sleep 5
          done
          echo "App failed health check"
          docker compose logs app
          exit 1
