name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── CI: install, lint, build ──────────────────────────────
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:@localhost:3306/rcc_hiros
      JWT_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + production build)
        run: npm run build

  # ── CD: build image and deploy on merge to main ──────────
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: self-hosted
    defaults:
      run:
        # Windows PowerShell with policy bypass — the runner host uses Restricted
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Build and start production stack
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          $extra = @()
          if ($env:TUNNEL_TOKEN) { $extra = @("--profile", "tunnel") }
          docker compose @extra up -d --build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Health check
        run: |
          $code = "000"
          foreach ($i in 1..30) {
            $code = (curl.exe -s -o NUL -w "%{http_code}" --max-time 5 http://localhost:3000/)
            Write-Host "attempt $i -> HTTP $code"
            if ($code -ne "000" -and $code -ne "") { break }
            Start-Sleep -Seconds 5
          }
          if ($code -eq "000" -or $code -eq "") {
            Write-Host "App failed health check"
            docker compose logs app
            exit 1
          }
          Write-Host "App is responding (HTTP $code)"
